<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 1. Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090212" />
      <stop offset="50%" stop-color="#100524" />
      <stop offset="100%" stop-color="#0b0318" />
    </linearGradient>

    <!-- 2. Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" />
    </pattern>

    <!-- 3. Glow Filter for Particles -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 4. Soft Vignette (Shadow on edges) -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="70%" stop-color="transparent" stop-opacity="0" />
      <stop offset="100%" stop-color="#090212" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <!-- Render Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Render Animated Grid -->
  <g opacity="0.8">
    <!-- Phóng to grid để khi di chuyển không bị đứt quãng -->
    <rect width="3000" height="2000" fill="url(#grid)" x="-500" y="-500">
      <!-- Hiệu ứng trôi chéo liên tục -->
      <animateTransform attributeName="transform" type="translate" from="0 0" to="80 80" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Render Particles (Hạt dữ liệu) -->
  <g filter="url(#glow)">
    <!-- Hạt Tím (Purple) - Góc trái trên -->
    <circle cx="100" cy="100" r="4" fill="#a855f7">
      <animate attributeName="cy" values="100; 500; 100" dur="25s" repeatCount="indefinite" />
      <animate attributeName="cx" values="100; 300; 100" dur="30s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Hạt Hồng Sáng (Light Pink) - Góc phải trên -->
    <circle cx="1800" cy="150" r="5" fill="#f472b6">
      <animate attributeName="cy" values="150; 700; 150" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1800; 1500; 1800" dur="28s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 0.9; 0.3" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Hạt Hồng (Pink) - Góc trái dưới -->
    <circle cx="200" cy="950" r="3.5" fill="#ec4899">
      <animate attributeName="cy" values="950; 500; 950" dur="35s" repeatCount="indefinite" />
      <animate attributeName="cx" values="200; 400; 200" dur="22s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1; 1; 0.1" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Hạt Trắng - Góc phải dưới -->
    <circle cx="1700" cy="900" r="3" fill="#f8fafc">
      <animate attributeName="cy" values="900; 400; 900" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1700; 1400; 1700" dur="25s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Hạt Violet - Góc phải giữa -->
    <circle cx="1500" cy="500" r="4.5" fill="#8b5cf6">
      <animate attributeName="cy" values="500; 200; 500" dur="22s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1500; 1800; 1500" dur="19s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="4.5s" repeatCount="indefinite" />
    </circle>

    <!-- Hạt Tím Nhạt - Góc trái giữa -->
    <circle cx="400" cy="600" r="3.5" fill="#c084fc">
      <animate attributeName="cy" values="600; 100; 600" dur="28s" repeatCount="indefinite" />
      <animate attributeName="cx" values="400; 100; 400" dur="24s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 0.7; 0.3" dur="5.5s" repeatCount="indefinite" />
    </circle>

    <!-- Hạt Hồng Đậm - Giữa trên -->
    <circle cx="960" cy="100" r="4" fill="#db2777">
      <animate attributeName="cy" values="100; 400; 100" dur="21s" repeatCount="indefinite" />
      <animate attributeName="cx" values="960; 700; 960" dur="26s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Hạt Tím Đậm - Giữa dưới -->
    <circle cx="960" cy="950" r="4.5" fill="#7c3aed">
      <animate attributeName="cy" values="950; 600; 950" dur="32s" repeatCount="indefinite" />
      <animate attributeName="cx" values="960; 1200; 960" dur="27s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15; 0.75; 0.15" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Overlay Vignette (Viền tối) -->
  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>
